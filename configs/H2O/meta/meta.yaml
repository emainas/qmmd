system: H2O
buffer: 6.0
prefix: solv

dftb_dirname: dftb
replica_dirname: equil
cv_dirname: meta-h2o

run_ids: "1-90"
bench_tag: N1T16C1
restart_name: restart

dftb:
  title: "DC-DFTB3/3ob, PBC (NVT)"

  header_lines:
    - "SCC=(THIRDFULL=TRUE DAMPXH=TRUE ALMIX=0.3)"
    - "SCC=(READCHARGE=NONE)"
    - "SCC=(MAXITER=1000)" 
    - "DC=(SUBTYPE=AUTO DELTARXYZ=3.0 BUFRAD=6.0)"
    - "MD=(NSTEP=60000 DELTAT=0.5D-15)"
    - "MD=(RESTART=TRUE READVELOCITY=FALSE)"
    - "MD=(NVT=TRUE NVTTYPE=5 BATHTEMP=300.0)"
    - "MD=(COLLISIONFREQ=0.01)"
    - "MD=(INITTEMP=300.0 ERRORTEMP=1000)"
    - "MD=(LIMULLIKEN=TRUE LIDEGREE=10 LIMINDEG=TRUE)"
    - "MD=(PRINT=40 SEEDTYPE=3 RANDOMSEED=0)"
    - "MD=(METADYNAMICS=TRUE METAPRINTFES=TRUE METARESTART=FALSE)"
    - "MD=(METAFREQ=80 METAHEIGHT=5e-4)"
    - "MISC=(PRINTLAPTIME=TRUE)"
    - "MISC=(WRITECHRGFILE=FALSE)"
    - "PBC=TRUE"

  charge: 0
  multiplicity: 1

  elements:
    - { symbol: H, lmax: 1, hubbard: -0.1857 }
    - { symbol: O, lmax: 2, hubbard: -0.1575 }

  params_dir: "params"

runtime:
  module: "openmpi/5.0.6_intel-2024.2.1"
  executable: "/nas/longleaf/home/emainas/software/dcdftbmd.2.0/dr_nishimura/20260126_Dcdftbmd/bin/dftb_mpiomp.00.x"
  mpirun_np: 16
  env:
    PATH: "/nas/longleaf/home/emainas/software/dcdftbmd.2.0/:$PATH"
  strict_mode: true

slurm:
  job:
    name: H2O
    partition: small
    nodes: 1
    ntasks: 16
    mem: "50G"
    cpus_per_task: 1
    time: "10:00:00"
    stdout: "slurm.%j.out"
    stderr: "slurm.%j.err"
