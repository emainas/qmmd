system: ISO
buffer: 4.0
prefix: solv

dftb_dirname: dftb
replica_dirname: equil
cv_dirname: meta-hic

run_ids: "1-20"
bench_tag: N1T48C1
restart_name: restart

dftb:
  title: "DC-DFTB3/3ob, PBC (NVT)"

  header_lines:
    - "SCC=(THIRDFULL=TRUE DAMPXH=TRUE ALMIX=0.3)"
    - "SCC=(READCHARGE=NONE)"
    - "SCC=(MAXITER=1000)"
    - "DC=(SUBTYPE=AUTO DELTARXYZ=3.0 BUFRAD=6.0)"
    - "MD=(NSTEP=80000 DELTAT=0.5D-15)"
    - "MD=(RESTART=TRUE READVELOCITY=FALSE)"
    - "MD=(NVT=TRUE NVTTYPE=5 BATHTEMP=300.0)"
    - "MD=(COLLISIONFREQ=0.01)"
    - "MD=(INITTEMP=300.0 ERRORTEMP=1000)"
    - "MD=(LIMULLIKEN=TRUE LIDEGREE=10 LIMINDEG=TRUE)"
    - "MD=(PRINT=40 SEEDTYPE=3 RANDOMSEED=0)"
    - "MD=(METADYNAMICS=TRUE METAPRINTFES=TRUE METARESTART=FALSE)"
    - "MD=(METAFREQ=80 METAHEIGHT=5e-4)"
    - "MISC=(PRINTLAPTIME=TRUE)"
    - "MISC=(WRITECHRGFILE=FALSE)"
    - "PBC=TRUE"

  charge: 0
  multiplicity: 1

  elements:
    - { symbol: H, lmax: 1, hubbard: -0.1857 }
    - { symbol: O, lmax: 2, hubbard: -0.1575 }
    - { symbol: C, lmax: 2, hubbard: -0.1492 }
    - { symbol: N, lmax: 2, hubbard: -0.1535 }

  params_dir: "params"

runtime:
  module: "openmpi_5.0.6/intel_2024.2.1"
  executable: "/nas/sycamore/home/emainas/software/dcdftbmd.2.0/dr_nishimura/20260126_Dcdftbmd/bin/dftb_mpiomp.00.x"
  mpirun_np: 16
  env:
    PATH: "/nas/sycamore/home/emainas/software/dcdftbmd.2.0/:$PATH"
  strict_mode: true

slurm:
  job:
    name: ISOC
    partition: batch
    nodes: 1
    ntasks: 48
    mem: "50G"
    cpus_per_task: 1
    time: "4-00:00:00"
    stdout: "slurm.%j.out"
    stderr: "slurm.%j.err"
