system: TPS
buffer: 10.0
prefix: solv
job_name: titr-refep-5state-pka4p9
input_parm7: mdequil/solv_mbondi2.parm7
input_rst7: equil-npt.rst7

# Isolated-TPS transferability control. These are the same five TPS states,
# REFEP BAR energies, and pKa-correction gauge used in the composite BLA run.
cpin:
  cph_igb: 2
  sites:
    - residue_number: 1
      residue_name: TPS
      charge_sets: configs/TPS/cphmd/charge_sets.csv
      states: [ppp, app, bpp, cpp, dpp]
      # One common +80.67439123 kcal/mol gauge shift keeps Amber's STATENE
      # nonnegative without changing any pairwise energy or population.
      statene:
        - 80.67439123
        - 0.0          # APP: G(PPP)-G(APP) from GB2-rescored REFEP BAR
        - 53.07782318  # BPP: shifted from -27.59656805
        - 45.62767715  # CPP: shifted from -35.04671408
        - 41.36556088  # DPP: shifted from -39.30883035
      # Pairwise pKas are 4.9 for APP/DPP and 4.5 for BPP/CPP.
      pka_corr: [4.9, 0.0, 0.4, 0.4, 0.0]

ph_ladder:
  values: [2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5, 6.0, 6.5, 7.0]

# 250 exchanges x 1000 steps x 0.002 ps = 500 ps per replica.
remd_mdin:
  production:
    description: Isolated TPS five-state mbondi2 RECpHMD transferability control
    cntrl:
      iwrap: 1
      imin: 0
      irest: 1
      ntx: 5
      nstlim: 1000
      numexchg: 250
      dt: 0.002
      tempi: 300.0
      temp0: 300.0
      ntt: 3
      gamma_ln: 1.0
      ig: -1
      ntb: 1
      ntp: 0
      ntc: 2
      ntf: 2
      cut: 8.0
      ntpr: 500
      ntwx: 500
      ntwr: 1000
      ioutfm: 1
      icnstph: 2
      ntcnstph: 100
      ntrelax: 100
      saltcon: 0.1

runtime:
  module: amber/26
  executable: /proj/pierilab/software/amber/ambertools25/bin/sander.MPI
  mpi_launcher: mpirun
  processes_per_replica: 1
  env:
    TEMP: 300
  strict_mode: true

slurm:
  job:
    name: tps-5state-pka49
    partition: small
    nodes: 1
    ntasks: 10
    time: "5:00:00"
    stdout: "slurm.%j.out"
    stderr: "slurm.%j.err"

postprocess:
  output_dir: post
  cpptraj_executable: cpptraj
  fraction: protonated

titration_report:
  output_dir: report
  residue_id: 1
  reference_pka: 4.05343
  fit_hill: true
  discard_time_ps: 0.0
  block_count: 5
  rolling_window_records: 25
  slope_window_exchanges: 10
  style: plotting/lefteris.mplstyle
  composite:
    tps:
      residue_id: 1
      residue_name: TPS
      protonated_state: ppp
      deprotonated_states: [app, bpp, cpp, dpp]
      microstate_model_pkas:
        app: 4.9
        bpp: 4.5
        cpp: 4.5
        dpp: 4.9
