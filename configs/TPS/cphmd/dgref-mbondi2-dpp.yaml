system: TPS
buffer: 10.0
prefix: solv
job_name: dgref-mbondi2-pka4p9/dpp
input_parm7: mdequil/solv_mbondi2.parm7
input_rst7: equil-npt.rst7

cpin:
  charge_sets: configs/TPS/cphmd/charge_sets.csv
  states: [ppp, dpp]
  statene: DELTAGREF, 0.0
  pka_corr: 4.9, 0.0
  cph_igb: 2

# Seed the corrected search from the converged pKa=5.0 result, shifted by
# -RT ln(10) * 0.1 at 300 K. finddgref.py still performs a fresh calibration.
search:
  dgref_estimate: 39.173894

report:
  discard_first: 8

dgref_mdin:
  dgref_nvt:
    description: TPS PPP-to-DPP pKa 4.9 mbondi2 reference-energy calibration at 300 K and constant volume
    cntrl:
      iwrap: 1
      imin: 0
      irest: 1
      ntx: 5
      nstlim: 1000000
      dt: 0.001
      temp0: 300.0
      ntt: 3
      gamma_ln: 2.0
      ntb: 1
      ntp: 0
      ntc: 2
      ntf: 2
      cut: 8.0
      ntpr: 500
      ntwx: 1000
      ntwe: 0
      icnstph: 2
      ntcnstph: 100
      solvph: 4.9
      ntrelax: 100
      saltcon: 0.1

runtime:
  module: amber/26
  executable: sander
  env:
    TEMP: 300
  strict_mode: true

slurm:
  job:
    name: tps-dgref-mb2-dpp-p49
    partition: small
    nodes: 2
    time: "48:00:00"
    stdout: "slurm.%j.out"
    stderr: "slurm.%j.err"
