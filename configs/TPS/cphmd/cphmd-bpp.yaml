system: TPS
buffer: 10.0
prefix: solv
job_name: titr-bpp
input_parm7: solv.parm7
input_rst7: equil-npt.rst7
dgref_job_name: dgref/bpp

cpin:
  charge_sets: configs/TPS/cphmd/charge_sets.csv
  # Two-state titration: protonated PPP and deprotonated BPP only.
  states: [ppp, bpp]
  pka_corr: [4.5, 0.0]
  cph_igb: 2

# Ten evenly spaced replicas bracket the PPP/BPP reference pKa of 4.5.
ph_ladder:
  values: [2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5, 6.0, 6.5]

# 500 exchanges x 1000 steps x 0.002 ps = 1 ns per replica.
remd_mdin:
  production:
    description: Explicit-solvent replica-exchange constant-pH MD for TPS PPP/BPP
    cntrl:
      iwrap: 1
      imin: 0
      irest: 1
      ntx: 5
      nstlim: 1000
      numexchg: 500
      dt: 0.002
      tempi: 300.0
      temp0: 300.0
      ntt: 3
      gamma_ln: 1.0
      ig: -1
      ntb: 1
      ntp: 0
      ntc: 2
      ntf: 2
      cut: 8.0
      ntpr: 500
      ntwx: 500
      ntwr: 1000
      ioutfm: 1
      icnstph: 2
      ntcnstph: 100
      ntrelax: 100
      saltcon: 0.1

runtime:
  module: amber/26
  executable: pmemd.MPI
  mpi_launcher: mpirun
  processes_per_replica: 2
  env:
    TEMP: 300
  strict_mode: true

slurm:
  job:
    name: tps-titr-bpp
    partition: small
    nodes: 2
    ntasks: 20
    time: "5:00:00"
    stdout: "slurm.%j.out"
    stderr: "slurm.%j.err"

postprocess:
  output_dir: post
  cpptraj_executable: cpptraj
  fraction: protonated

titration_report:
  output_dir: report
  residue_id: 1
  reference_pka: 4.5
  fit_hill: true
  discard_time_ps: 0.0
  block_count: 5
  rolling_window_records: 25
  slope_window_exchanges: 10
  style: plotting/lefteris.mplstyle
