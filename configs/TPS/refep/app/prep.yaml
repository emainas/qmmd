system: TPS
buffer: 10.0
prefix: solv

# PPP (+1) is the common single topology; APP (0) removes the HA charge.
input_parm7: systems/TPS/solv_10.0/mdequil/solv_mbondi2.parm7
input_rst7: systems/TPS/solv_10.0/mdequil/equil-npt.rst7
deprot_mol2: systems/TPS/init/atp.mol2

ligand:
  residue_id: 1
  residue_name: TPS
  dummy_atoms: [HA]
  expected_charge_lambda0: 1
  expected_charge_lambda1: 0
  charge_tolerance: 0.01

interpolation:
  windows: 16
  lambda0_label: protonated-ppp
  lambda1_label: deprotonated-app

output:
  directory: systems/TPS/solv_10.0/refep/app/topology
  plot: charge-interpolation.png
  style: plotting/prl.mplstyle

runtime:
  module: amber/26
  parmed_executable: parmed
