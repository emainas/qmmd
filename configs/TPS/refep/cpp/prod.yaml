equil_yaml: equil.yaml
stage_dirname: prod-5ns

restraint: null

# 500 steps/exchange * 5000 exchanges * 0.002 ps = 5 ns per replica.
remd_mdin:
  production:
    description: TPS PPP-to-CPP charge-interpolation Hamiltonian replica exchange
    cntrl:
      iwrap: 1
      imin: 0
      irest: 1
      ntx: 5
      nstlim: 500
      numexchg: 5000
      dt: 0.002
      temp0: 300.0
      ntt: 3
      gamma_ln: 2.0
      ig: -1
      ntb: 1
      ntp: 0
      ntc: 2
      ntf: 2
      cut: 8.0
      ntpr: 500
      ntwx: 5000
      ntwr: 50000
      ntwe: 0
      ioutfm: 1

runtime:
  module: amber/26
  executable: pmemd.MPI
  mpi_launcher: mpirun
  processes_per_replica: 2
  rem_mode: 3
  env:
    TEMP: 300
  strict_mode: true

slurm:
  job:
    name: tps-cpp-refep-prod-5ns
    partition: small
    nodes: 2
    ntasks: 32
    tasks_per_node: 16
    time: "48:00:00"
    stdout: "slurm.%j.out"
    stderr: "slurm.%j.err"

single_point:
  stage_dirname: post
  energy_dirname: energies
  mdin:
    energy:
      description: TPS PPP-to-CPP explicit-solvent cross-Hamiltonian energy evaluation
      cntrl:
        imin: 5
        maxcyc: 1
        ntb: 1
        ntp: 0
        cut: 8.0
        ntc: 2
        ntf: 2
        ioutfm: 1
        ntpr: 1
        ntwx: 0
        ntwe: 0
  runtime:
    module: amber/26
    executable: sander
    launcher: srun
    ncdump_executable: ncdump
    cpptraj_executable: cpptraj
    local_workers: 16
    strict_mode: true
  slurm:
    job:
      name: tps-cpp-refep-sp
      partition: small
      nodes: 2
      ntasks: 96
      tasks_per_node: 48
      memory: 32G
      time: "4:00:00"
      stdout: "slurm.%j.out"
      stderr: "slurm.%j.err"

report:
  output_dir: report
  reference_state: protonated-ppp
  style: plotting/prl.mplstyle
  temperature_k: 300.0
  bootstrap_samples: 200
  bootstrap_block_frames: 5
  bootstrap_seed: 20261008
  histogram_bins: 20
  convergence_min_frames: 10
  convergence_stride_frames: 5
  mbar_tolerance: 1.0e-10
  mbar_max_iterations: 10000
