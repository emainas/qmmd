system: PRX
buffer: 10.0
prefix: solv
job_name: titr
input_parm7: solv_modradii.parm7
input_rst7: equil-npt.rst7
dgref_job_name: dgref

cpin:
  charge_sets: configs/PRX/cphmd/charge_sets.csv
  # State order: deprotonated, O1-syn, O1-anti, O2-syn, O2-anti.
  pka_corr: [0.0, 4.85, 4.85, 4.85, 4.85]
  cph_igb: 2

# Ten evenly spaced replicas bracket the PRX reference pKa of 4.85.
ph_ladder:
  values: [2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5, 6.0, 6.5, 7.0]

# nstlim steps are run between exchanges; this is 1 ns per replica.
remd_mdin:
  production:
    description: Explicit-solvent replica-exchange constant-pH MD for PRX
    cntrl:
      iwrap: 1
      imin: 0
      irest: 1
      ntx: 5
      nstlim: 1000
      numexchg: 500
      dt: 0.002
      tempi: 300.0
      temp0: 300.0
      ntt: 3
      gamma_ln: 1.0
      ig: -1
      ntb: 1
      ntp: 0
      ntc: 2
      ntf: 2
      cut: 8.0
      ntpr: 500
      ntwx: 500
      ntwr: 1000
      ioutfm: 1
      icnstph: 2
      ntcnstph: 100
      ntrelax: 100
      saltcon: 0.1

runtime:
  module: amber/26
  # Amber 26 provides serial sander only. This lab AmberTools 25 MPI build is
  # compatible with the current OpenMPI module and accepts the one-H CAP
  # residue that pmemd.MPI rejects during topology initialization.
  executable: /proj/pierilab/software/amber/ambertools25/bin/sander.MPI
  mpi_launcher: mpirun
  processes_per_replica: 2
  env:
    TEMP: 300
  strict_mode: true

slurm:
  job:
    name: prx-titr
    partition: small
    nodes: 2
    ntasks: 20
    time: "5:00:00"
    stdout: "slurm.%j.out"
    stderr: "slurm.%j.err"

postprocess:
  output_dir: post
  cpptraj_executable: cpptraj
  fraction: protonated

titration_report:
  output_dir: report
  residue_id: 1
  reference_pka: 4.85
  fit_hill: true
  discard_time_ps: 0.0
  block_count: 5
  rolling_window_records: 25
  slope_window_exchanges: 10
  style: plotting/lefteris.mplstyle
  syn_anti:
    syn_states: [o1_syn, o2_syn]
    anti_states: [o1_anti, o2_anti]
