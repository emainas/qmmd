name: PRX

leaprc_mol: leaprc.gaff2
leaprc_sol: leaprc.water.tip3p
frcmod_ion: frcmod.ionsjc_tip3p

# Four-dummy carboxylic-acid master generated by cphmd-prep.
mol2: systems/PRX/init/prx_cphmd.mol2
frcmod: systems/PRX/init/prx_cphmd.frcmod

# HA3 closes the standalone reference compound but is not part of the
# transferable 13-atom PRX titratable residue or its CPIN charge arrays.
additional_mol2:
  - unit: cap
    mol2: systems/PRX/init/prx_cap.mol2
inter_residue_bonds:
  - [1.CA, 2.HA3]

water_model: TIP3PBOX
buffer: 10.0

# The master topology is the deprotonated (-1) state.
counterion: Na+
counterion_num: 1

input_dir: systems/PRX/init/
prefix: solv
