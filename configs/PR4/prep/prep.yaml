name: PR4

leaprc_mol: leaprc.gaff2
leaprc_sol: leaprc.water.tip3p
frcmod_ion: frcmod.ionsjc_tip3p

# Four-dummy carboxylic-acid master generated by cphmd-prep.
mol2: systems/PR4/init/pr4_cphmd.mol2
frcmod: systems/PR4/init/pr4_cphmd.frcmod

water_model: TIP3PBOX
buffer: 5.5

# The master topology is the deprotonated (-1) state.
counterion: Na+
counterion_num: 1

input_dir: systems/PR4/init/
prefix: solv
