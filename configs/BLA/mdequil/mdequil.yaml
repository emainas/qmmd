system: BLA
buffer: 10.0
prefix: solv
job_name: mdequil

# Use the post-LEaP topology with 1.3 A GB radii on both PRX O1/O2 pairs.
input_parm7: solv_modradii.parm7
input_rst7: solv.rst7

md:
  minimize:
    description: Minimize BLA in explicit solvent
    cntrl:
      imin: 1
      maxcyc: 500
      ncyc: 200
      ntb: 1
      cut: 8.0
      ntr: 0
      ntpr: 100

  heat:
    description: Heat BLA from 0 to 300 K
    cntrl:
      imin: 0
      irest: 0
      ntx: 1
      nstlim: 50000
      dt: 0.001
      tempi: 0.0
      temp0: 300.0
      ntt: 3
      gamma_ln: 2.0
      ntb: 1
      ntp: 0
      ntc: 2
      ntf: 2
      cut: 8.0
      ntpr: 500
      ntwx: 1000
      ntwe: 0
    wt:
      - type: TEMP0
        istep1: 0
        istep2: 50000
        value1: 0.0
        value2: 300.0
      - type: END

  equilibrate_nvt:
    description: Equilibrate BLA at 300 K and constant volume
    cntrl:
      imin: 0
      irest: 1
      ntx: 5
      nstlim: 100000
      dt: 0.001
      temp0: 300.0
      ntt: 3
      gamma_ln: 2.0
      ntb: 1
      ntp: 0
      ntc: 2
      ntf: 2
      cut: 8.0
      ntpr: 500
      ntwx: 1000
      ntwe: 0

  equilibrate_npt:
    description: Equilibrate BLA for 1 ns at 300 K and 1 bar
    cntrl:
      iwrap: 1
      imin: 0
      irest: 1
      ntx: 5
      nstlim: 1000000
      dt: 0.001
      temp0: 300.0
      ntt: 3
      gamma_ln: 2.0
      ntb: 2
      ntp: 1
      taup: 2.0
      pres0: 1.0
      ntc: 2
      ntf: 2
      cut: 8.0
      ntpr: 500
      ntwx: 1000
      ntwe: 0

runtime:
  module: amber/26
  executable: sander
  env:
    TEMP: 300
    PRESS: 1.0
  strict_mode: true

slurm:
  job:
    name: bla-mdequil
    partition: small
    nodes: 2
    time: "10:00:00"
    stdout: "slurm.%j.out"
    stderr: "slurm.%j.err"
