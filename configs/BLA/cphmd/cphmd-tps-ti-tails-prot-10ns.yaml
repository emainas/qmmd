system: BLA
buffer: 10.0
prefix: solv
job_name: titr-tps-ti-tails-prot-10ns-pka4p9
input_parm7: refep/tps-tails-prot/master/bla-ppp-prx-o1syn-mbondi2.parm7
input_rst7: refep/tps-tails-prot/master/bla-ppp-prx-o1syn.rst7

# Rings-only conditional titration. TPS residue 1 is CpHMD-active, while both
# PRX tails remain fixed in their protonated O1-syn topology states.
cpin:
  cph_igb: 2
  sites:
    - residue_number: 1
      residue_name: TPS
      charge_sets: configs/TPS/cphmd/charge_sets.csv
      states: [ppp, app, bpp, cpp, dpp]
      # Conditional BLA GB2-rescored TI values with both PRX tails fixed
      # protonated, all in kcal/mol:
      #   G(PPP)-G(APP) = 83.15429840
      #   G(PPP)-G(BPP) = 30.62886906
      #   G(PPP)-G(CPP) = 38.66430705
      #   G(PPP)-G(DPP) = 41.35256721
      # A common +83.15429840 gauge shift keeps every STATENE nonnegative.
      statene:
        - 83.15429840  # PPP
        - 0.00000000   # APP
        - 52.52542934  # BPP
        - 44.48999135  # CPP
        - 41.80173119  # DPP
      # Pairwise PPP pKa values: APP/DPP=4.9 and BPP/CPP=4.5.
      pka_corr: [4.9, 0.0, 0.4, 0.4, 0.0]
      # Zero-charge TPS model caps are replaced by the bonded PRX residues.
      omit_atoms: [H2C, H3B]

ph_ladder:
  values: [2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5, 6.0, 6.5, 7.0]

# 5000 exchanges x 1000 steps x 0.002 ps = 10 ns per replica.
remd_mdin:
  production:
    description: BLA rings-only RECpHMD with conditional TI energies and fixed protonated O1-syn PRX tails
    cntrl:
      iwrap: 1
      imin: 0
      irest: 1
      ntx: 5
      nstlim: 1000
      numexchg: 5000
      dt: 0.002
      tempi: 300.0
      temp0: 300.0
      ntt: 3
      gamma_ln: 1.0
      ig: -1
      ntb: 1
      ntp: 0
      ntc: 2
      ntf: 2
      cut: 8.0
      ntpr: 500
      ntwx: 500
      ntwr: 1000
      ioutfm: 1
      icnstph: 2
      ntcnstph: 100
      ntrelax: 100
      saltcon: 0.1

runtime:
  module: amber/26
  executable: pmemd.MPI
  mpi_launcher: mpirun
  processes_per_replica: 2
  env:
    TEMP: 300
  strict_mode: true

slurm:
  job:
    name: bla-tps-prot-p49-10ns
    partition: small
    nodes: 2
    ntasks: 20
    time: "24:00:00"
    stdout: "slurm.%j.out"
    stderr: "slurm.%j.err"

postprocess:
  output_dir: post
  cpptraj_executable: cpptraj
  fraction: protonated

titration_report:
  output_dir: report
  residue_id: 1
  reference_pka: 4.05343
  fit_hill: true
  discard_time_ps: 0.0
  block_count: 5
  rolling_window_records: 25
  slope_window_exchanges: 10
  style: plotting/lefteris.mplstyle
  composite:
    tps:
      residue_id: 1
      residue_name: TPS
      protonated_state: ppp
      deprotonated_states: [app, bpp, cpp, dpp]
      microstate_model_pkas:
        app: 4.9
        bpp: 4.5
        cpp: 4.5
        dpp: 4.9
