system: BLA
buffer: 10.0
prefix: solv
job_name: titr-prn-mbondi2
input_parm7: solv_prn_mbondi2.parm7
input_rst7: equil-npt.rst7

# Controlled test: titrating TPS plus two standard Amber PRN charge models.
cpin:
  cph_igb: 2
  sites:
    - residue_number: 1
      residue_name: TPS
      charge_sets: configs/TPS/cphmd/charge_sets.csv
      states: [ppp, bpp, cpp]
      omit_atoms: [H2C, H3B]
      statene:
        - 0.0
        - dgref_log: systems/TPS/solv_10.0/cphmd/dgref-mbondi2/bpp/dgref.log
          multiplier: -1.0
        - dgref_log: systems/TPS/solv_10.0/cphmd/dgref-mbondi2/cpp/dgref.log
          multiplier: -1.0
      pka_corr: [4.5, 0.0, 0.0]

    - residue_number: 2
      residue_name: PRN
      charge_sets: configs/BLA/cphmd/prn_charge_sets.csv
      states: [deprot, o1_syn, o1_anti, o2_syn, o2_anti]
      statene: [0.0, 16.751825, 16.751825, 16.751825, 16.751825]
      pka_corr: [0.0, 4.85, 4.85, 4.85, 4.85]

    - residue_number: 3
      residue_name: PRN
      charge_sets: configs/BLA/cphmd/prn_charge_sets.csv
      states: [deprot, o1_syn, o1_anti, o2_syn, o2_anti]
      statene: [0.0, 16.751825, 16.751825, 16.751825, 16.751825]
      pka_corr: [0.0, 4.85, 4.85, 4.85, 4.85]

ph_ladder:
  values: [2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5, 6.0, 6.5, 7.0]

# Initial comparison uses the same 100 ps/replica protocol as the PRX run.
remd_mdin:
  production:
    description: BLA mbondi2 test with TPS and two standard PRN sites
    cntrl:
      iwrap: 1
      imin: 0
      irest: 1
      ntx: 5
      nstlim: 1000
      numexchg: 50
      dt: 0.002
      tempi: 300.0
      temp0: 300.0
      ntt: 3
      gamma_ln: 1.0
      ig: -1
      ntb: 1
      ntp: 0
      ntc: 2
      ntf: 2
      cut: 8.0
      ntpr: 500
      ntwx: 500
      ntwr: 1000
      ioutfm: 1
      icnstph: 2
      ntcnstph: 100
      ntrelax: 100
      saltcon: 0.1

runtime:
  module: amber/26
  executable: pmemd.MPI
  mpi_launcher: mpirun
  processes_per_replica: 2
  env:
    TEMP: 300
  strict_mode: true

slurm:
  job:
    name: bla-prn-mb2
    partition: small
    nodes: 2
    ntasks: 20
    time: "5:00:00"
    stdout: "slurm.%j.out"
    stderr: "slurm.%j.err"

postprocess:
  output_dir: post
  cpptraj_executable: cpptraj
  fraction: protonated

titration_report:
  output_dir: report
  residue_id: 1
  reference_pka: 4.5
  fit_hill: true
  discard_time_ps: 0.0
  block_count: 5
  rolling_window_records: 25
  slope_window_exchanges: 10
  style: plotting/lefteris.mplstyle
  composite:
    tps:
      residue_id: 1
      residue_name: TPS
      protonated_state: ppp
      bpp_state: bpp
      cpp_state: cpp
    prx:
      residue_ids: [2, 3]
      residue_name: PRN
      deprotonated_state: deprot
      syn_states: [o1_syn, o2_syn]
      anti_states: [o1_anti, o2_anti]
