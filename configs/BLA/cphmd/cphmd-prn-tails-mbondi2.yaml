system: BLA
buffer: 10.0
prefix: solv
job_name: titr-prn-tails-mbondi2
input_parm7: solv_prn_mbondi2.parm7
input_rst7: equil-npt.rst7

# TPS residue 1 is deliberately absent from the CPIN and therefore remains in
# its protonated PPP topology state. Only the two standard PRN tails titrate.
cpin:
  cph_igb: 2
  sites:
    - residue_number: 2
      residue_name: PRN
      charge_sets: configs/BLA/cphmd/prn_charge_sets.csv
      states: [deprot, o1_syn, o1_anti, o2_syn, o2_anti]
      statene: [0.0, 16.751825, 16.751825, 16.751825, 16.751825]
      pka_corr: [0.0, 4.85, 4.85, 4.85, 4.85]

    - residue_number: 3
      residue_name: PRN
      charge_sets: configs/BLA/cphmd/prn_charge_sets.csv
      states: [deprot, o1_syn, o1_anti, o2_syn, o2_anti]
      statene: [0.0, 16.751825, 16.751825, 16.751825, 16.751825]
      pka_corr: [0.0, 4.85, 4.85, 4.85, 4.85]

ph_ladder:
  values: [2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5, 6.0, 6.5, 7.0]

# 50 exchanges x 1000 steps x 0.002 ps = 100 ps per replica.
remd_mdin:
  production:
    description: BLA mbondi2 control with fixed protonated TPS and two titrating PRN tails
    cntrl:
      iwrap: 1
      imin: 0
      irest: 1
      ntx: 5
      nstlim: 1000
      numexchg: 50
      dt: 0.002
      tempi: 300.0
      temp0: 300.0
      ntt: 3
      gamma_ln: 1.0
      ig: -1
      ntb: 1
      ntp: 0
      ntc: 2
      ntf: 2
      cut: 8.0
      ntpr: 500
      ntwx: 500
      ntwr: 1000
      ioutfm: 1
      icnstph: 2
      ntcnstph: 100
      ntrelax: 100
      saltcon: 0.1

runtime:
  module: amber/26
  executable: pmemd.MPI
  mpi_launcher: mpirun
  processes_per_replica: 2
  env:
    TEMP: 300
  strict_mode: true

slurm:
  job:
    name: bla-prn-tails-mb2
    partition: small
    nodes: 2
    ntasks: 20
    time: "5:00:00"
    stdout: "slurm.%j.out"
    stderr: "slurm.%j.err"

postprocess:
  output_dir: post
  cpptraj_executable: cpptraj
  fraction: protonated

titration_report:
  output_dir: report
  residue_id: 2
  reference_pka: 4.85
  fit_hill: true
  discard_time_ps: 0.0
  block_count: 5
  rolling_window_records: 25
  slope_window_exchanges: 10
  style: plotting/lefteris.mplstyle
  composite:
    prx:
      residue_ids: [2, 3]
      residue_name: PRN
      deprotonated_state: deprot
      syn_states: [o1_syn, o2_syn]
      anti_states: [o1_anti, o2_anti]
