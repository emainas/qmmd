system: BLA
buffer: 10.0
prefix: solv
job_name: titr
input_parm7: solv_prx_mbondi2.parm7
input_rst7: equil-npt.rst7

# Composite CPIN: all four deprotonated TPS tautomers and two independently
# titrating PRX tails. TPS REFEP BAR estimates use
#   deltaG = G(PPP) - G(tautomer),
# so the common CPIN gauge is E(PPP)=0 and E(tautomer)=-deltaG.
cpin:
  cph_igb: 2
  sites:
    - residue_number: 1
      residue_name: TPS
      charge_sets: configs/TPS/cphmd/charge_sets.csv
      states: [ppp, app, bpp, cpp, dpp]
      # These zero-charge caps are absent after TPS is bonded to the PRX tails.
      omit_atoms: [H2C, H3B]
      statene:
        - 0.0
        # BAR values from each prod-5ns/report-igb2/summary.yaml.
        - -80.67439123  # APP
        - -27.59656805  # BPP
        - -35.04671408  # CPP
        - -39.30883035  # DPP
      # Effective pairwise pKa values: PPP/APP=5.0, PPP/BPP=4.5,
      # PPP/CPP=4.5, and PPP/DPP=5.0.
      pka_corr: [5.0, 0.0, 0.5, 0.5, 0.0]

    - residue_number: 2
      residue_name: PRX
      charge_sets: configs/PRX/cphmd/charge_sets.csv
      states: [deprot, o1_syn, o1_anti, o2_syn, o2_anti]
      statene:
        - 0.0
        - dgref_log: systems/PRX/solv_10.0/cphmd/dgref-mbondi2/dgref.log
        - dgref_log: systems/PRX/solv_10.0/cphmd/dgref-mbondi2/dgref.log
        - dgref_log: systems/PRX/solv_10.0/cphmd/dgref-mbondi2/dgref.log
        - dgref_log: systems/PRX/solv_10.0/cphmd/dgref-mbondi2/dgref.log
      pka_corr: [0.0, 4.85, 4.85, 4.85, 4.85]

    - residue_number: 3
      residue_name: PRX
      charge_sets: configs/PRX/cphmd/charge_sets.csv
      states: [deprot, o1_syn, o1_anti, o2_syn, o2_anti]
      statene:
        - 0.0
        - dgref_log: systems/PRX/solv_10.0/cphmd/dgref-mbondi2/dgref.log
        - dgref_log: systems/PRX/solv_10.0/cphmd/dgref-mbondi2/dgref.log
        - dgref_log: systems/PRX/solv_10.0/cphmd/dgref-mbondi2/dgref.log
        - dgref_log: systems/PRX/solv_10.0/cphmd/dgref-mbondi2/dgref.log
      pka_corr: [0.0, 4.85, 4.85, 4.85, 4.85]

# Ten replicas bracket both the 4.5 TPS and 4.85 PRX reference pKa values.
ph_ladder:
  values: [2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5, 6.0, 6.5, 7.0]

# 250 exchanges x 1000 steps x 0.002 ps = 500 ps per replica.
remd_mdin:
  production:
    description: BLA mbondi2 RECpHMD with four TPS tautomers and two PRX tails
    cntrl:
      iwrap: 1
      imin: 0
      irest: 1
      ntx: 5
      nstlim: 1000
      numexchg: 250
      dt: 0.002
      tempi: 300.0
      temp0: 300.0
      ntt: 3
      gamma_ln: 1.0
      ig: -1
      ntb: 1
      ntp: 0
      ntc: 2
      ntf: 2
      cut: 8.0
      ntpr: 500
      ntwx: 500
      ntwr: 1000
      ioutfm: 1
      icnstph: 2
      ntcnstph: 100
      ntrelax: 100
      saltcon: 0.1

runtime:
  module: amber/26
  executable: pmemd.MPI
  mpi_launcher: mpirun
  processes_per_replica: 2
  env:
    TEMP: 300
  strict_mode: true

slurm:
  job:
    name: bla-titr-refep
    partition: small
    nodes: 2
    ntasks: 20
    time: "5:00:00"
    stdout: "slurm.%j.out"
    stderr: "slurm.%j.err"

postprocess:
  output_dir: post
  cpptraj_executable: cpptraj
  fraction: protonated

titration_report:
  output_dir: report
  residue_id: 1
  reference_pka: 4.5
  fit_hill: true
  discard_time_ps: 0.0
  block_count: 5
  rolling_window_records: 25
  slope_window_exchanges: 10
  style: plotting/lefteris.mplstyle
  composite:
    tps:
      residue_id: 1
      residue_name: TPS
      protonated_state: ppp
      deprotonated_states: [app, bpp, cpp, dpp]
    prx:
      residue_ids: [2, 3]
      residue_name: PRX
      deprotonated_state: deprot
      syn_states: [o1_syn, o2_syn]
      anti_states: [o1_anti, o2_anti]
