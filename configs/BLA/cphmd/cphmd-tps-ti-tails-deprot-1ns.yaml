system: BLA
buffer: 10.0
prefix: solv
job_name: titr-tps-ti-tails-deprot-1ns
input_parm7: solv_prx_mbondi2.parm7
input_rst7: equil-npt.rst7

# Rings-only conditional titration. TPS residue 1 is CpHMD-active, while both
# PRX tails remain fixed in their deprotonated (-1) topology states.
cpin:
  cph_igb: 2
  sites:
    - residue_number: 1
      residue_name: TPS
      charge_sets: configs/TPS/cphmd/charge_sets.csv
      states: [ppp, app, bpp, cpp, dpp]
      # Conditional BLA GB2-rescored TI values, all in kcal/mol:
      #   G(PPP)-G(APP) = 81.91213251
      #   G(PPP)-G(BPP) = 29.00975620
      #   G(PPP)-G(CPP) = 37.06180945
      #   G(PPP)-G(DPP) = 40.32416801
      # A common +81.91213251 gauge shift keeps every STATENE nonnegative.
      statene:
        - 81.91213251  # PPP
        - 0.00000000   # APP
        - 52.90237631  # BPP
        - 44.85032306  # CPP
        - 41.58796450  # DPP
      # Pairwise PPP pKa values: APP/DPP=5.0 and BPP/CPP=4.5.
      pka_corr: [5.0, 0.0, 0.5, 0.5, 0.0]
      # Zero-charge TPS model caps are replaced by the bonded PRX residues.
      omit_atoms: [H2C, H3B]

ph_ladder:
  values: [2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5, 6.0, 6.5, 7.0]

# 500 exchanges x 1000 steps x 0.002 ps = 1 ns per replica.
remd_mdin:
  production:
    description: BLA rings-only RECpHMD with conditional TI energies and fixed deprotonated PRX tails
    cntrl:
      iwrap: 1
      imin: 0
      irest: 1
      ntx: 5
      nstlim: 1000
      numexchg: 500
      dt: 0.002
      tempi: 300.0
      temp0: 300.0
      ntt: 3
      gamma_ln: 1.0
      ig: -1
      ntb: 1
      ntp: 0
      ntc: 2
      ntf: 2
      cut: 8.0
      ntpr: 500
      ntwx: 500
      ntwr: 1000
      ioutfm: 1
      icnstph: 2
      ntcnstph: 100
      ntrelax: 100
      saltcon: 0.1

runtime:
  module: amber/26
  executable: pmemd.MPI
  mpi_launcher: mpirun
  processes_per_replica: 2
  env:
    TEMP: 300
  strict_mode: true

slurm:
  job:
    name: bla-tps-ti-1ns
    partition: small
    nodes: 2
    ntasks: 20
    time: "8:00:00"
    stdout: "slurm.%j.out"
    stderr: "slurm.%j.err"

postprocess:
  output_dir: post
  cpptraj_executable: cpptraj
  fraction: protonated

titration_report:
  output_dir: report
  residue_id: 1
  reference_pka: 4.0797
  fit_hill: true
  discard_time_ps: 0.0
  block_count: 5
  rolling_window_records: 25
  slope_window_exchanges: 10
  style: plotting/lefteris.mplstyle
  composite:
    tps:
      residue_id: 1
      residue_name: TPS
      protonated_state: ppp
      deprotonated_states: [app, bpp, cpp, dpp]
      microstate_model_pkas:
        app: 5.0
        bpp: 4.5
        cpp: 4.5
        dpp: 5.0
