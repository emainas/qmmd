system: BLA
buffer: 10.0
prefix: agg4
job_name: titr-rings-4bla-10ns-pka4p9
input_parm7: agg4_mbondi2.parm7
input_rst7: equil-npt.rst7

# Four BLA copies are ordered TPS-PRX-PRX. Only TPS residues 1, 4, 7 and 10
# titrate; all eight PRX tails remain fixed in their deprotonated topology state.
cpin:
  cph_igb: 2
  sites:
    - &tps_ring
      residue_number: 1
      residue_name: TPS
      charge_sets: configs/TPS/cphmd/charge_sets.csv
      states: [ppp, app, bpp, cpp, dpp]
      # Conditional BLA GB2-rescored TI energies with deprotonated PRX tails.
      statene: [81.91213251, 0.0, 52.90237631, 44.85032306, 41.58796450]
      # Pairwise PPP pKas: APP/DPP=4.9 and BPP/CPP=4.5.
      pka_corr: [4.9, 0.0, 0.4, 0.4, 0.0]
      omit_atoms: [H2C, H3B]
    - <<: *tps_ring
      residue_number: 4
    - <<: *tps_ring
      residue_number: 7
    - <<: *tps_ring
      residue_number: 10

ph_ladder:
  values: [2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5, 6.0, 6.5, 7.0]

# 5000 exchanges x 1000 steps x 0.002 ps = 10 ns per replica.
remd_mdin:
  production:
    description: Four-BLA rings-only RECpHMD with fixed deprotonated PRX tails
    cntrl:
      iwrap: 1
      imin: 0
      irest: 1
      ntx: 5
      nstlim: 1000
      numexchg: 5000
      dt: 0.002
      tempi: 300.0
      temp0: 300.0
      ntt: 3
      gamma_ln: 1.0
      ig: -1
      ntb: 1
      ntp: 0
      ntc: 2
      ntf: 2
      cut: 8.0
      ntpr: 500
      ntwx: 500
      ntwr: 1000
      ioutfm: 1
      icnstph: 2
      ntcnstph: 100
      ntrelax: 100
      saltcon: 0.1

runtime:
  module: amber/26
  executable: pmemd.MPI
  mpi_launcher: mpirun
  processes_per_replica: 2
  env:
    TEMP: 300
  strict_mode: true

slurm:
  job:
    name: bla4-rings-cphmd-10ns
    partition: small
    nodes: 2
    ntasks: 20
    time: "48:00:00"
    stdout: "slurm.%j.out"
    stderr: "slurm.%j.err"

postprocess:
  output_dir: post
  cpptraj_executable: cpptraj
  fraction: protonated

titration_report:
  output_dir: report
  residue_id: 1
  reference_pka: 4.9
  fit_hill: true
  discard_time_ps: 0.0
  block_count: 5
  rolling_window_records: 25
  slope_window_exchanges: 10
  style: plotting/lefteris.mplstyle
