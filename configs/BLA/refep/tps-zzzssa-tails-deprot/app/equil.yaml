prep_yaml: prep.yaml
stage_dirname: equil

dihedral:
  label: psi_CD
  atom_ids: [31, 36, 41, 45]
  target_deg: 180.0
restraint:
  atoms: [31, 36, 41, 45]
  target_deg: 180.0
  force_constant: 50.0

equil_mdin:
  nvt:
    description: Conditional ZZZssa BLA PPP-to-APP REFEP equilibration at 300 K
    cntrl: {iwrap: 1, imin: 0, irest: 1, ntx: 5, nstlim: 100000, dt: 0.002, temp0: 300.0, ntt: 3, gamma_ln: 2.0, ig: -1, ntb: 1, ntp: 0, ntc: 2, ntf: 2, cut: 8.0, ntpr: 500, ntwx: 1000, ntwr: 5000, ioutfm: 1}
runtime: {module: amber/26, executable: pmemd, launcher: srun, strict_mode: true}
slurm:
  job: {name: bla-zsa-app-equil, partition: small, nodes: 2, ntasks: 16, tasks_per_node: 8, time: "2:00:00", stdout: "slurm.%j.out", stderr: "slurm.%j.err"}
