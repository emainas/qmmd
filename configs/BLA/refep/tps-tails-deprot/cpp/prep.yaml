system: BLA
buffer: 10.0
prefix: solv

input_parm7: systems/BLA/solv_10.0/prep/solv_prx_mbondi2.parm7
input_rst7: systems/BLA/solv_10.0/mdequil/equil-npt.rst7
deprot_mol2: systems/TPS/init/ctp.mol2

ligand:
  residue_id: 1
  residue_name: TPS
  dummy_atoms: [HC]
  endpoint_omit_atoms: [H2C, H3B]
  expected_charge_lambda0: 1
  expected_charge_lambda1: 0
  charge_tolerance: 0.01

interpolation:
  windows: 16
  lambda0_label: protonated-ppp
  lambda1_label: deprotonated-cpp

output:
  directory: systems/BLA/solv_10.0/refep/tps-tails-deprot/cpp/topology
  plot: charge-interpolation.png
  style: plotting/prl.mplstyle

runtime:
  module: amber/26
  parmed_executable: parmed
