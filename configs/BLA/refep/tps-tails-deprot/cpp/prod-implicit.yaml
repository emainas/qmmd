equil_yaml: equil.yaml
stage_dirname: prod-5ns
restraint: null
remd_mdin:
  production:
    description: Conditional BLA PPP-to-CPP charge-interpolation Hamiltonian replica exchange
    cntrl: {iwrap: 1, imin: 0, irest: 1, ntx: 5, nstlim: 500, numexchg: 5000, dt: 0.002, temp0: 300.0, ntt: 3, gamma_ln: 2.0, ig: -1, ntb: 1, ntp: 0, ntc: 2, ntf: 2, cut: 8.0, ntpr: 500, ntwx: 5000, ntwr: 50000, ntwe: 0, ioutfm: 1}
runtime: {module: amber/26, executable: pmemd.MPI, mpi_launcher: mpirun, processes_per_replica: 2, rem_mode: 3, env: {TEMP: 300}, strict_mode: true}
slurm:
  job: {name: bla-cpp-refep-prod-5ns, partition: small, nodes: 2, ntasks: 32, tasks_per_node: 16, time: "48:00:00", stdout: "slurm.%j.out", stderr: "slurm.%j.err"}
single_point:
  stage_dirname: post-igb2
  energy_dirname: energies
  keep_mask: ":1-3"
  stripped_dirname: stripped
  mdin:
    energy:
      description: Conditional BLA PPP-to-CPP GB2 rescoring with both PRX tails retained
      cntrl: {imin: 5, maxcyc: 1, ntb: 0, ntp: 0, igb: 2, saltcon: 0.1, cut: 999.0, rgbmax: 999.0, ntc: 2, ntf: 2, ioutfm: 1, ntpr: 1, ntwx: 0, ntwe: 0}
  runtime: {module: amber/26, executable: sander, launcher: srun, ncdump_executable: ncdump, cpptraj_executable: cpptraj, local_workers: 16, strict_mode: true}
  slurm:
    job: {name: bla-cpp-refep-igb2-sp, partition: small, nodes: 2, ntasks: 96, tasks_per_node: 48, memory: 32G, time: "8:00:00", stdout: "slurm.%j.out", stderr: "slurm.%j.err"}
report: {output_dir: report-igb2, reference_state: protonated-ppp, style: plotting/prl.mplstyle, temperature_k: 300.0, bootstrap_samples: 200, bootstrap_block_frames: 5, bootstrap_seed: 20261009, histogram_bins: 20, convergence_min_frames: 10, convergence_stride_frames: 5, mbar_tolerance: 1.0e-10, mbar_max_iterations: 10000}
