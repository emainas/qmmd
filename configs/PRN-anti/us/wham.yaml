prod_yaml: prod.yaml
output_dirname: wham

# Production follows a separate 40 ps restrained equilibration, so retain all
# production frames. Increase this value only after a convergence diagnosis.
discard_ps: 0.0

# These windows describe the unwrapped anti-to-syn path from 180 to 0 degrees,
# not the complete 360-degree torsional circle. Bounds include the sampled tails;
# the reported figure is cropped to the physical path of interest.
coordinate:
  minimum_deg: -20.0
  maximum_deg: 200.0
  bins: 110
  periodic: false
  report_minimum_deg: 0.0
  report_maximum_deg: 180.0

wham:
  executable: /nas/sycamore/home/emainas/software/wham/wham/wham
  tolerance: 1.0e-6
  temperature_k: 300.0
  padding: 0
  # DCDFTBMD METAWALL coefficients are kJ/mol/CV^2; qmmd converts them to
  # Grossfield WHAM's kcal/mol/CV^2 half-K convention.

# PMFs have an arbitrary additive constant. Align the original and every
# bootstrap PMF to the same syn-basin interval before calculating uncertainty.
zero_reference_deg: [0.0, 5.0]

# Minima and transition maximum are searched only within these physical ranges.
# Basin populations are integrated on either side of the detected maximum.
thermodynamics:
  syn_range_deg: [0.0, 30.0]
  anti_range_deg: [150.0, 180.0]
  transition_range_deg: [60.0, 120.0]

# Plot-only regularization of the raw 2-degree PMF values. The smooth guide is
# drawn in addition to, never instead of, the WHAM points and error bars.
plot:
  smoothing_penalty: 10.0

bootstrap:
  enabled: true
  replicas: 500
  block_length_ps: 2.0
  seed: 20260920
  confidence_level: 0.95
  minimum_success_fraction: 0.90
