prod_yaml: prod-dih.yaml
output_dirname: wham-dih

# Retain every currently reported production frame. BV windows 000-002 are
# shorter than 40 ps, but each contains enough data for 2 ps block resampling.
discard_ps: 0.0

# The windows span the unwrapped single15 rotation from 0 to 180 degrees, not
# the complete 360-degree torsional circle. Bounds include the sampled tails.
coordinate:
  minimum_deg: -20.0
  maximum_deg: 200.0
  bins: 110
  periodic: false
  report_minimum_deg: 0.0
  report_maximum_deg: 180.0

wham:
  executable: /nas/sycamore/home/emainas/software/wham/wham/wham
  tolerance: 1.0e-6
  temperature_k: 300.0
  padding: 0

# Align the original and every bootstrap PMF to the 0-degree basin.
zero_reference_deg: [0.0, 5.0]

# In the existing torsional WHAM module, the 0-degree and 180-degree endpoint
# basins are reported as syn and anti, respectively.
thermodynamics:
  syn_range_deg: [0.0, 30.0]
  anti_range_deg: [150.0, 180.0]
  transition_range_deg: [60.0, 120.0]

# Plot-only smoothing; raw WHAM values and thermodynamics remain unchanged.
plot:
  smoothing_penalty: 10.0

bootstrap:
  enabled: true
  replicas: 500
  block_length_ps: 2.0
  seed: 20261008
  confidence_level: 0.95
  minimum_success_fraction: 0.90
