system: MAH
buffer: 5.5
prefix: solv
output_dirname: us-lcod

# Use the completed unbiased DFTB equilibration trajectory from run 1 as the
# source of nearest available starting structures for the umbrella windows.
source:
  trajectory: systems/MAH/solv_5.5/dftb/N1T48C1/run-1/equil/traject
  dftb_input: systems/MAH/solv_5.5/dftb/N1T48C1/run-1/equil/dftb.inp

windows:
  start_angstrom: -1.5
  stop_angstrom: 1.5
  spacing_angstrom: 0.1

cv:
  type: BONDDISTANCEDIFFERENCE
  gaussian_width_angstrom: 0.1
  atoms: [1, 2, 8, 2]  # r(O1,HO) - r(O2,HO)
  label: "r(O1,HO) − r(O2,HO)"
