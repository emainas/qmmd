system: MAH
buffer: 5.5
prefix: solv

dftb_dirname: dftb
replica_dirname: equil
cv_dirname: meta-h
run_ids: "1-10"
bench_tag: N1T48C1

# O1-HO coordination. This distinguishes the two malonaldehyde tautomers:
# high coordination is O1-bound and low coordination is O2-bound.
cv_title: RATIONALCOORDINATIONNUMBER
gausswidth: 0.1
nexp: 6
mexp: 12
refdist: 1.6
method: LABELS
norm: AVERAGE
grid_min: 0.0
grid_max: 1.0
grid_step: 0.01

group1:
  mode: indices
  indices: [1]  # O1, one-based

group2:
  mode: indices
  indices: [2]  # transferring proton HO, one-based
