system: CPP
buffer: 4.0
prefix: solv
output_dirname: us-single15

# Begin from the final coordinates and velocities of the completed Amber NPT run.
# The source restart has single15 near -10 degrees in qmmd's established
# signed-dihedral convention, so the first 0-degree window is nearby.
source:
  topology_dirname: prep
  topology_name: solv.parm7
  restart_dirname: mdequil
  restart_name: equil-npt.rst7
  output_name: equil-npt.out

# Inclusive centers: 0, 10, ..., 170, 180 degrees. This follows the same
# nonperiodic half-rotation strategy used for PRN anti-to-syn, with the
# direction reversed to start from CPP's ZZZsss geometry.
windows:
  start_deg: 0.0
  stop_deg: 180.0
  spacing_deg: 10.0

# CPP single15 = NC-C4C-C15-C1D. Atom IDs are one-based in ready.parm7:
# NC31-C4C35-C15(40)-C1D44.
# Amber uses E = force_constant * angular_displacement_in_radians^2.
restraint:
  atoms: [31, 35, 40, 44]
  force_constant: 50.0  # kcal/mol/rad^2

# Each window is a 1 ps continuation of the preceding NPT restart.
md:
  description: "CPP single15 0-to-180 degree pulling window"
  cntrl:
    iwrap: 1
    imin: 0
    irest: 1
    ntx: 5
    nstlim: 1000
    dt: 0.001
    temp0: 300.0
    ntt: 3
    gamma_ln: 2.0
    ntb: 2
    ntp: 1
    taup: 2.0
    pres0: 1.0
    ntc: 2
    ntf: 2
    cut: 3.5
    ntpr: 100
    ntwx: 100
    ntwe: 0

runtime:
  module: amber/26
  executable: sander
  env:
    TEMP: 300
    PRESS: 1.0
  strict_mode: true

# All 19 windows run serially inside this one Slurm allocation.
slurm:
  job:
    name: CPP-us-single15-pull
    partition: small
    nodes: 2
    time: "01:00:00"
    stdout: slurm.%j.out
    stderr: slurm.%j.err
