discard_ps: 0.0

coordinate:
  minimum_deg: -20.0
  maximum_deg: 230.0
  bins: 125
  periodic: false
  report_minimum_deg: 0.0
  report_maximum_deg: 210.0

wham:
  executable: /nas/sycamore/home/emainas/software/wham/wham/wham
  tolerance: 1.0e-6
  temperature_k: 300.0
  padding: 0

zero_reference_deg: [0.0, 5.0]

thermodynamics:
  syn_range_deg: [0.0, 30.0]
  anti_range_deg: [150.0, 210.0]
  transition_range_deg: [60.0, 120.0]

plot:
  smoothing_penalty: 10.0

bootstrap:
  enabled: true
  replicas: 500
  block_length_ps: 2.0
  seed: 20261029
  confidence_level: 0.95
  minimum_success_fraction: 0.90
