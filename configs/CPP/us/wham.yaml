equil_yaml: equil.yaml
output_dirname: wham-equil

# This is an exploratory PMF from equilibration, not independent production.
# Keep every trajectory-derived cpptraj sample; discard_ps can be increased.
discard_ps: 0.0

coordinate:
  minimum_angstrom: -2.2
  maximum_angstrom: 2.5
  bins: 94  # 0.05 Å
  report_minimum_angstrom: -2.05
  report_maximum_angstrom: 2.35

wham:
  executable: /nas/sycamore/home/emainas/software/wham/wham/wham
  tolerance: 1.0e-6
  temperature_k: 300.0
  padding: 0

# Additive zero: mean raw WHAM PMF around the negative-LCOD minimum.
zero_reference_angstrom: [-1.3, -1.1]

plot:
  smoothing_penalty: 20.0  # gentler basin minima; pmf.csv remains raw WHAM
  xlim_angstrom: [-2.0, 2.0]

# Search the smooth guide for one minimum on each proton-binding side.
basins:
  negative_lcod_angstrom: [-1.8, -0.6]
  positive_lcod_angstrom: [0.6, 2.0]
