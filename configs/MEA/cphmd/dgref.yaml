system: MEA
buffer: 5.5
prefix: solv
job_name: dgref
input_parm7: solv.parm7
input_rst7: equil-npt.rst7

cpin:
 charge_sets: configs/MEA/cphmd/charge_sets.csv
 statene: DELTAGREF, 0.0
 pka_corr: 9.0, 0.0
 cph_igb: 2

report:
  discard_first: 8

dgref_mdin:
 dgref_nvt:
   description: MD at 300 K at constant volume
   cntrl:
     iwrap: 1
     imin: 0
     irest: 1
     ntx: 5
     nstlim: 100000
     dt: 0.001
     temp0: 300.0
     ntt: 3
     gamma_ln: 2.0
     ntb: 1
     ntp: 0
     ntc: 2
     ntf: 2
     cut: 5.0
     ntpr: 500
     ntwx: 1000
     ntwe: 0
     icnstph: 2
     ntcnstph: 100
     solvph: 9.0
     ntrelax: 100
     saltcon: 0.1

runtime:
  module: "amber/26"
  executable: "sander"
  env:
    TEMP: 300
  strict_mode: true

slurm:
  job:
    name: dgref
    partition: small
    nodes: 2
    time: "5:00:00"
    stdout: "slurm.%j.out"
    stderr: "slurm.%j.err"
