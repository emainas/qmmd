system: PRN-syn
buffer: 5.5
prefix: solv

# Use the equilibrated protonated syn conformer as the common single topology.
input_parm7: systems/PRN-syn/solv_5.5/prep/solv.parm7
input_rst7: systems/PRN-syn/solv_5.5/mdequil/equil-npt.rst7

# Atom-name mapping supplies the deprotonated endpoint charges. H11 is absent
# from PR4 and therefore remains in the topology as a zero-charge dummy.
deprot_mol2: systems/PR4/init/pr4.mol2

ligand:
  residue_id: 1
  residue_name: PRN
  dummy_atoms: [H11]
  expected_charge_lambda0: 0
  expected_charge_lambda1: -1
  charge_tolerance: 0.01

interpolation:
  windows: 16
  lambda0_label: protonated-syn
  lambda1_label: deprotonated

output:
  directory: systems/PRN-syn/solv_5.5/refep/topology
  plot: charge-interpolation.png
  style: plotting/prl.mplstyle

runtime:
  module: amber/26
  parmed_executable: parmed
